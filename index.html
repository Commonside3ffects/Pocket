<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pocket</title>
<style>
/* Layout: a Notion-style workspace. Grey sidebar of pages, a white document column with an icon and a
   big title, and database-style rows split by hairlines. Phones swap the sidebar for a bottom tab bar
   and a thumb-reach + button. Flat surfaces, 4px radii, colour only in tags, bars and the chart. */
:root{
  --bg:#ffffff; --side:#f7f7f5; --pop:#ffffff; --callout:#f1f1ef; --field:#f7f6f3;
  --fg:#37352f; --fg2:#73726e; --fg3:#91908c;
  --line:#e9e9e7; --line2:#d9d9d6; --hover:rgba(55,53,47,.06); --active:rgba(55,53,47,.1);
  --accent:#2383e2; --accent-h:#0b6fcf; --on-accent:#ffffff; --accent-soft:rgba(35,131,226,.14);
  --scrim:rgba(15,15,15,.55);
  --shadow:0 0 0 1px rgba(15,15,15,.06),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.18);
  --good:#448361; --warn:#b87d1c; --bad:#d44c47;
  --gray-b:#e3e2e0; --gray-f:#32302c; --gray-s:#91918e;
  --brown-b:#eee0da; --brown-f:#442a1e; --brown-s:#9f6b53;
  --orange-b:#fadec9; --orange-f:#49290e; --orange-s:#d9730d;
  --yellow-b:#fdecc8; --yellow-f:#402c1b; --yellow-s:#cb912f;
  --green-b:#dbeddb; --green-f:#1c3829; --green-s:#448361;
  --blue-b:#d3e5ef; --blue-f:#183347; --blue-s:#337ea9;
  --purple-b:#e8deee; --purple-f:#412454; --purple-s:#9065b0;
  --pink-b:#f5e0e9; --pink-f:#4c2337; --pink-s:#c14c8a;
  --red-b:#ffe2dd; --red-f:#5d1715; --red-s:#d44c47;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191919; --side:#202020; --pop:#252525; --callout:#262626; --field:#2c2c2c;
  --fg:#d4d4d4; --fg2:#9b9b9b; --fg3:#7f7f7f;
  --line:#2f2f2f; --line2:#3d3d3d; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.1);
  --accent:#2383e2; --accent-h:#3b93ea; --on-accent:#ffffff; --accent-soft:rgba(35,131,226,.22);
  --scrim:rgba(0,0,0,.6);
  --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.45);
  --good:#529e72; --warn:#ca9849; --bad:#df5452;
  --gray-b:#5a5a5a; --gray-f:#e8e8e8; --gray-s:#9b9b9b;
  --brown-b:#603b2c; --brown-f:#f0e0d8; --brown-s:#ba856f;
  --orange-b:#854c1d; --orange-f:#fbe6d4; --orange-s:#c77d48;
  --yellow-b:#89632a; --yellow-f:#fbedce; --yellow-s:#ca9849;
  --green-b:#2b593f; --green-f:#dcefe2; --green-s:#529e72;
  --blue-b:#28456c; --blue-f:#d9e8f8; --blue-s:#5e9bd6;
  --purple-b:#492f64; --purple-f:#eadff3; --purple-s:#9d68d3;
  --pink-b:#69314c; --pink-f:#f7dfea; --pink-s:#d15796;
  --red-b:#6e3630; --red-f:#fde0dc; --red-s:#df5452;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --pop:#252525; --callout:#262626; --field:#2c2c2c;
  --fg:#d4d4d4; --fg2:#9b9b9b; --fg3:#7f7f7f;
  --line:#2f2f2f; --line2:#3d3d3d; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.1);
  --accent:#2383e2; --accent-h:#3b93ea; --on-accent:#ffffff; --accent-soft:rgba(35,131,226,.22);
  --scrim:rgba(0,0,0,.6);
  --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.3),0 9px 24px rgba(0,0,0,.45);
  --good:#529e72; --warn:#ca9849; --bad:#df5452;
  --gray-b:#5a5a5a; --gray-f:#e8e8e8; --gray-s:#9b9b9b;
  --brown-b:#603b2c; --brown-f:#f0e0d8; --brown-s:#ba856f;
  --orange-b:#854c1d; --orange-f:#fbe6d4; --orange-s:#c77d48;
  --yellow-b:#89632a; --yellow-f:#fbedce; --yellow-s:#ca9849;
  --green-b:#2b593f; --green-f:#dcefe2; --green-s:#529e72;
  --blue-b:#28456c; --blue-f:#d9e8f8; --blue-s:#5e9bd6;
  --purple-b:#492f64; --purple-f:#eadff3; --purple-s:#9d68d3;
  --pink-b:#69314c; --pink-f:#f7dfea; --pink-s:#d15796;
  --red-b:#6e3630; --red-f:#fde0dc; --red-s:#df5452;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

.c-gray{--tb:var(--gray-b);--tf:var(--gray-f);--ts:var(--gray-s)}
.c-brown{--tb:var(--brown-b);--tf:var(--brown-f);--ts:var(--brown-s)}
.c-orange{--tb:var(--orange-b);--tf:var(--orange-f);--ts:var(--orange-s)}
.c-yellow{--tb:var(--yellow-b);--tf:var(--yellow-f);--ts:var(--yellow-s)}
.c-green{--tb:var(--green-b);--tf:var(--green-f);--ts:var(--green-s)}
.c-blue{--tb:var(--blue-b);--tf:var(--blue-f);--ts:var(--blue-s)}
.c-purple{--tb:var(--purple-b);--tf:var(--purple-f);--ts:var(--purple-s)}
.c-pink{--tb:var(--pink-b);--tf:var(--pink-f);--ts:var(--pink-s)}
.c-red{--tb:var(--red-b);--tf:var(--red-f);--ts:var(--red-s)}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100dvh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100dvh;overflow-y:auto;padding:10px 6px;display:flex;flex-direction:column;gap:1px}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-weight:600}
.brand svg{flex:none}
.nav{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:4px;color:var(--fg2);font-weight:500;min-height:30px}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--active);color:var(--fg)}
.nav .e{width:20px;text-align:center;flex:none}
.side-label{padding:14px 8px 4px;font-size:12px;color:var(--fg3);font-weight:500}
.side-foot{margin-top:auto;padding:10px 8px 4px;display:flex;flex-direction:column;gap:6px}
.side-foot small{color:var(--fg3);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding-inline:14px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--fg2);min-width:0}
.crumb b{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sl{color:var(--fg3)}
.crumb .app-name{display:none;align-items:center;gap:6px}
.top-act{display:flex;gap:2px}
.page{width:100%;max-width:960px;margin-inline:auto;padding-inline:clamp(16px,5vw,56px);padding-block:18px 96px;display:flex;flex-direction:column;gap:28px}
.title{display:flex;flex-direction:column;gap:6px}
.title .ico{font-size:44px;line-height:1.1}
.title h1{font-size:32px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.title p{color:var(--fg2);max-width:62ch}
.tabs{display:none}
.fab{display:flex;position:fixed;right:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:21;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(15,15,15,.3);transition:transform .12s ease,background .12s ease}
.fab:hover{background:var(--accent-h);transform:scale(1.05)}
.fab:active{background:var(--accent-h);transform:scale(.97)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:3px 10px;border-radius:4px;border:1px solid var(--line2);background:var(--bg);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.txt{border-color:transparent;background:none;color:var(--fg2)}
.btn.txt:hover{background:var(--hover);color:var(--fg)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.danger:hover{background:var(--red-b);color:var(--red-f)}
.btn.lg{min-height:36px;padding-inline:14px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;color:var(--fg2);flex:none}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib[disabled]{opacity:.3;cursor:default}
.in,.sel{min-height:32px;padding:4px 9px;border-radius:4px;border:1px solid var(--line2);background:var(--field);width:100%;min-width:0}
.in:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.in{resize:vertical;min-height:64px;font-family:var(--mono);font-size:12px}
.seg{display:inline-flex;background:var(--hover);border-radius:6px;padding:2px;gap:2px;max-width:100%}
.seg button{padding:3px 10px;border-radius:4px;color:var(--fg2);font-weight:500;min-height:26px;white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line2)}
.views{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.views button{padding:6px 10px;color:var(--fg2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:4px 4px 0 0}
.views button:hover{background:var(--hover)}
.views button.on{color:var(--fg);border-bottom-color:var(--fg)}
.tag{display:inline-block;max-width:100%;padding:1px 7px;border-radius:3px;background:var(--tb);color:var(--tf);font-size:12.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.badge{display:inline-flex;align-items:center;gap:6px;padding:1px 8px 1px 7px;border-radius:10px;font-size:12.5px;white-space:nowrap;background:var(--hover);color:var(--fg2)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg3);flex:none}
.badge.good{background:var(--green-b);color:var(--green-f)} .badge.good::before{background:var(--green-s)}
.badge.warn{background:var(--yellow-b);color:var(--yellow-f)} .badge.warn::before{background:var(--yellow-s)}
.badge.bad{background:var(--red-b);color:var(--red-f)} .badge.bad::before{background:var(--red-s)}
.badge.info{background:var(--blue-b);color:var(--blue-f)} .badge.info::before{background:var(--blue-s)}
.dot{width:9px;height:9px;border-radius:2px;background:var(--ts);flex:none}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;min-width:0}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ts,var(--fg3));transition:width .25s ease}
.bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.muted{color:var(--fg2)} .faint{color:var(--fg3)} .small{font-size:12.5px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* blocks */
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;min-height:32px}
.sec-h h2{font-size:16px;font-weight:600}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:4px;background:var(--callout);align-items:flex-start}
.callout .e{font-size:18px;line-height:1.35;flex:none}
.callout .b{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.callout.warn{background:var(--yellow-b);color:var(--yellow-f)}
.callout.bad{background:var(--red-b);color:var(--red-f)}
.callout .btn{background:var(--bg);color:var(--fg)}
.rowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.month{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.month b{font-size:16px;font-weight:600;min-width:9.5em;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:6px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat label{font-size:12.5px;color:var(--fg2)}
.stat b{font-size:22px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.stat small{font-size:12px;color:var(--fg3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line2);border-radius:16px;font-weight:500;min-height:34px}
.chip:hover{background:var(--hover)}
.chip:active{background:var(--active)}
.chip b{color:var(--fg2);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 36px;align-items:start}
.bk{display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-radius:4px;width:100%}
.bk:hover{background:var(--hover)}
.bk-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bk-top b{font-weight:600}
.list{display:flex;flex-direction:column}
.donut-wrap{display:grid;grid-template-columns:148px minmax(0,1fr);gap:20px;align-items:center}
.donut{position:relative;width:148px;max-width:100%;aspect-ratio:1}
.donut svg{width:100%;height:100%;display:block}
.donut circle.arc{stroke:var(--ts);cursor:pointer;pointer-events:stroke;transition:opacity .15s}
.donut circle.arc:hover{opacity:.75}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:26px}
.donut-c small{color:var(--fg2);font-size:11.5px}
.donut-c b{font-size:15px;font-weight:600;overflow-wrap:anywhere;line-height:1.2}
.lg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;width:100%}
.lg-row:hover{background:var(--hover)}
.lg-row .nm{overflow-wrap:anywhere;line-height:1.35}
.empty{padding:22px 14px;border:1px dashed var(--line2);border-radius:6px;color:var(--fg2);text-align:center}

/* transactions */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 200px;min-width:0}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--fg3);pointer-events:none}
.search .in{padding-left:30px}
.txs{container-type:inline-size;border-top:1px solid var(--line)}
.tx{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,170px) 92px minmax(96px,auto) 28px;gap:4px 10px;align-items:center;padding:6px 6px;border-bottom:1px solid var(--line);cursor:pointer;min-height:40px}
.tx:hover{background:var(--hover)}
.tx-date,.tx-mode{color:var(--fg2);font-size:12.5px;white-space:nowrap}
.tx-desc{display:flex;gap:8px;align-items:baseline;min-width:0}
.tx-desc .ic{flex:none}
.tx-desc .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tx-desc .n{color:var(--fg3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tx-cat{min-width:0}
.tx-amt{text-align:right;font-weight:500;white-space:nowrap}
.tx-amt.income{color:var(--good)}
.tx-act{justify-self:end}
.tx-act .ib{opacity:0}
.tx:hover .tx-act .ib,.tx-act .ib:focus-visible{opacity:1}
@media (hover:none){.tx-act .ib{opacity:1}}
@container (max-width:620px){
  .tx{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"d d a" "dt c x";padding-block:9px}
  .tx-desc{grid-area:d}.tx-amt{grid-area:a}.tx-date{grid-area:dt}.tx-cat{grid-area:c}.tx-act{grid-area:x}
  .tx-mode{display:none}.tx-desc .n{display:none}.tx-act .ib{opacity:1}
}
.tx-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 6px;color:var(--fg2);font-size:12.5px}
.newrow{display:flex;align-items:center;gap:6px;padding:8px 6px;color:var(--fg3);width:100%;border-bottom:1px solid var(--line)}
.newrow:hover{background:var(--hover);color:var(--fg2)}
.check{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px}

/* budgets */
.buds{border-top:1px solid var(--line)}
.bud{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 232px 128px;gap:6px 14px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.bud-n{display:flex;gap:9px;align-items:center;min-width:0}
.bud-n .ic{flex:none;font-size:16px}
.bud-n div{min-width:0}
.bud-n b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud-n small{display:block;color:var(--fg3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud-v{display:flex;align-items:center;gap:6px;justify-content:flex-end;white-space:nowrap}
.bud-v .in{width:104px;text-align:right;min-height:28px;padding-block:2px}
.bud-s{display:flex;justify-content:flex-end;min-width:0}

/* debts */
.debt{display:grid;grid-template-columns:22px minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr) auto;gap:6px 12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.debt .ord{color:var(--fg3);font-size:12.5px;text-align:center}
.debt .nm{min-width:0}
.debt .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.debt .kv{display:flex;flex-direction:column;min-width:0}
.debt .kv small{color:var(--fg3);font-size:12px}
.debt .acts{display:flex;gap:4px;align-items:center}
.gantt{display:flex;flex-direction:column;gap:8px}
.g-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:12px;align-items:center}
.g-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;height:22px;background:var(--hover);border-radius:3px;min-width:0}
.g-fill{height:100%;border-radius:3px;background:var(--ts);min-width:3px}
.g-lab{position:absolute;inset:0;display:flex;align-items:center;padding-inline:8px;font-size:12px;white-space:nowrap;overflow:hidden}
.g-axis{display:flex;justify-content:space-between;color:var(--fg3);font-size:12px;padding-left:162px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cmp button{border:1px solid var(--line2);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cmp button:hover{background:var(--hover)}

// Monthly payoff simulation. list: [{id,bal,apr,min}]. Freed-up minimums roll into the next debt in line.
function simulate(list, strategy, extra) {
  const ds = list.filter(d => d.bal > 0.005).map(d => ({...d}));
  const order = [...ds].sort(strategy === 'snowball' ? (a, b) => a.bal - b.bal || b.apr - a.apr : (a, b) => b.apr - a.apr || a.bal - b.bal);

  }
  return `${titleHTML('budgets')}

}

/* ───────── debt ───────── */
function vDebt() {
  const plan = debtPlan(), cur = plan[state.strategy], other = plan[state.strategy === 'snowball' ? 'avalanche' : 'snowball'];
  const total = sum(plan.list, d => d.bal), mins = sum(state.debts.filter(d => debtBal(d) > 0), d => d.min), active = plan.list.filter(d => d.bal > 0.005).length;
  const byId = new Map(state.debts.map(d => [d.id, d]));
  const ordered = [...cur.order.map(id => byId.get(id)), ...state.debts.filter(d => debtBal(d) <= 0.005)];
  const hot = state.debts.filter(d => d.kind === 'Credit Card' && d.limit > 0 && debtBal(d) / d.limit > 0.3);
  const when = r => r.stuck ? 'Never at this pace' : monthLabel(shiftMonth(curMonth(), r.months));
  const card = (k, r, label, sub) => `<button class="${state.strategy === k ? 'on' : ''}" data-a="strategy" data-v="${k}"><b>${label}</b><span class="muted small">${sub}</span><span class="big num">${r.stuck ? 'Not paid off' : r.months + ' months'}</span><span class="small num">${r.stuck ? 'Payments do not cover the interest' : `Debt-free ${when(r)} · ${fmt(Math.round(r.interest))} interest`}</span></button>`;
  const rows = ordered.map((d, i) => {
    const bal = debtBal(d), done = bal <= 0.005, util = d.kind === 'Credit Card' && d.limit > 0 ? bal / d.limit * 100 : null, pm = cur.payoff[d.id];
    return `<div class="debt"><span class="ord num">${done ? '✓' : i + 1}</span>
      <div class="nm"><b>${esc(d.name)}</b><span class="tag c-${KIND_COLOR[d.kind] || 'gray'}">${esc(d.kind)}</span></div>
      <div class="kv k1"><span class="num"><b>${fmt(bal)}</b></span><small class="num">${d.apr}% APR · ${fmt(d.min)}/mo</small></div>
      <div class="kv k2"><span class="num">${done ? 'Paid off' : pm ? monthLabel(shiftMonth(curMonth(), pm), true) : '—'}</span><small>${util !== null ? `<span class="${util > 30 ? 'neg' : ''} num">${Math.round(util)}% of limit used</span>` : done ? '' : 'Projected payoff'}</small></div>
      <div class="acts">${done ? '' : `<button class="btn" data-a="payDebt" data-id="${d.id}">Log payment</button>`}<button class="ib" data-a="editDebt" data-id="${d.id}" aria-label="Edit ${esc(d.name)}">${I.edit}</button></div></div>`;
  }).join('');
  const span = Math.max(cur.months, 1);
  const gantt = cur.order.map(id => { const d = byId.get(id), pm = cur.payoff[id] || span; return `<div class="g-row c-${KIND_COLOR[d.kind] || 'gray'}"><span class="nm">${esc(d.name)}</span><div class="g-track"><div class="g-fill" style="width:${(pm / span * 100).toFixed(1)}%"></div><span class="g-lab num">${cur.payoff[id] ? `${pm} mo · ${monthLabel(shiftMonth(curMonth(), pm), true)}` : 'Not paid off'}</span></div></div>`; }).join('');
  const diff = Math.round(plan.snowball.interest - plan.avalanche.interest);
  return `${titleHTML('debt')}
  ${!state.debts.length ? `<div class="empty">No debts tracked. Add a card, loan or EMI to see a payoff plan.<div style="margin-top:10px"><button class="btn pri" data-a="newDebt">${I.plus} Add a debt</button></div></div>` : `
  <section class="stats" aria-label="Debt summary">
    <div class="stat"><label>Total remaining</label><b class="num">${fmt(total)}</b><small>${active} open ${active === 1 ? 'debt' : 'debts'}</small></div>
    <div class="stat"><label>Monthly minimums</label><b class="num">${fmt(mins)}</b><small>Plus ${fmt(state.extra)} extra</small></div>
    <div class="stat"><label>Debt-free by</label><b>${total ? when(cur) : 'Now'}</b><small>${total && !cur.stuck ? cur.months + ' months from now' : total ? 'Raise your payments' : 'Nothing owed'}</small></div>
    <div class="stat"><label>Interest still to pay</label><b class="num">${cur.stuck ? '—' : fmt(Math.round(cur.interest))}</b><small>With the ${state.strategy} plan</small></div>
  </section>
  ${hot.map(d => `<div class="callout warn"><span class="e">💳</span><div class="b"><div><b>${esc(d.name)} is using ${Math.round(debtBal(d) / d.limit * 100)}% of its limit.</b> Lenders read anything above 30% as a strain. Paying ${fmt(Math.ceil(debtBal(d) - d.limit * 0.3))} brings it under.</div></div></div>`).join('')}
  <section class="sec"><div class="sec-h"><h2>Payoff strategy</h2><label class="rowline small muted" for="extra">Extra each month <input class="in num" id="extra" type="number" inputmode="decimal" min="0" step="any" value="${state.extra || ''}" placeholder="0" data-c="extra" style="width:110px"></label></div>
    <div class="cmp">${card('avalanche', plan.avalanche, 'Avalanche', 'Highest interest rate first')}${card('snowball', plan.snowball, 'Snowball', 'Smallest balance first')}</div>
    ${total && !cur.stuck && !other.stuck ? `<p class="small muted">${diff > 0 ? `Avalanche saves ${fmt(diff)} in interest over snowball.` : 'Both orders cost the same here.'} Each time a debt clears, its payment rolls into the next one.</p>` : ''}
  </section>
  <section class="sec"><div class="sec-h"><h2>Your debts, in payoff order</h2><button class="btn" data-a="newDebt">${I.plus} Add a debt</button></div>
    <div class="buds">${rows}</div></section>
  ${total && !cur.stuck ? `<section class="sec"><div class="sec-h"><h2>Timeline</h2></div><div class="gantt">${gantt}<div class="g-axis"><span>Now</span><span>${when(cur)}</span></div></div></section>` : ''}`}`;
}

/* ───────── guide ───────── */
function vGuide() {
  const s = summary(ui.month), plan = debtPlan();
  const months = [0, -1, -2].map(n => summary(shiftMonth(curMonth(), n))).filter(x => x.needs > 0), needs = months.length ? sum(months, x => x.needs) / months.length : 0;
  const r100 = v => Math.round(v / 100) * 100, inc = s.income;
  const names = k => plan[k].order.map(id => esc(state.debts.find(d => d.id === id).name)).join(' → ') || '—';
  return `${titleHTML('guide')}
  <article class="doc">
    <h2>The 50/30/20 rule</h2>
    <p>Split take-home pay three ways. Half covers what you must pay. Under a third goes to what you enjoy. At least a fifth goes to your future self, as savings or as debt you clear.</p>
    <div class="viz sec"><div class="split"><span class="c-blue" style="flex:50">50% needs</span><span class="c-yellow" style="flex:30">30% wants</span><span class="c-green" style="flex:20">20%</span></div>
      ${inc ? `<div class="split-k num"><div><small>Needs</small><b>${fmt(inc * .5)}</b></div><div><small>Wants</small><b>${fmt(inc * .3)}</b></div><div><small>Savings &amp; debt</small><b>${fmt(inc * .2)}</b></div></div><p class="small muted">Worked from ${fmt(inc)} of income logged in ${monthLabel(ui.month)}.</p>` : '<p class="small muted">Log income for the month and your own split appears here.</p>'}</div>
    <details><summary>What counts as a need?</summary><div>Anything you would still pay in a lean month: rent, utilities, groceries, the commute, insurance, money sent to family. If skipping it has a real consequence, it is a need.</div></details>
    <details><summary>What counts as a want?</summary><div>Dining out, coffee runs, streaming, shopping, pubs and nights out. Wants are fine. The rule asks only that they stay under 30%.</div></details>
    <details><summary>Where do debt payments go?</summary><div>In the 20%. This app counts every debt payment toward Savings &amp; debt, because clearing a loan raises your net worth the same way saving does.</div></details>
    <div class="callout"><span class="e">💡</span><div class="b"><div>In Categories you can move any subcategory between Needs, Wants and Savings. A taxi is a need for one person and a want for another.</div></div></div>

    <h2>The emergency fund</h2>
    <p>Keep three to six months of essential spending somewhere you can reach in a day. Three months is the floor. Six suits anyone with irregular income or people depending on them.</p>
    <div class="viz sec"><div class="months"><span>1</span><span>2</span><span>3</span><span class="opt">4</span><span class="opt">5</span><span class="opt">6</span></div>
      ${needs ? `<p class="small muted num">Your needs average ${fmt(r100(needs))} a month, so aim for ${fmt(r100(needs * 3))} to ${fmt(r100(needs * 6))}.</p>` : '<p class="small muted">Log a month of needs spending to see your own target.</p>'}</div>
    <details><summary>Build the fund or pay debt first?</summary><div>Build a small starter fund of about one month, then put the extra toward high-interest debt, then return to finish the fund. A credit card charging 3% a month costs more than a savings account earns.</div></details>

    <h2>Snowball and avalanche</h2>
    <p>Both plans pay the minimum on every debt and throw everything extra at one target. They differ only in which debt goes first.</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Snowball</th><th>Avalanche</th></tr></thead><tbody>
      <tr><th>Pay first</th><td>Smallest balance</td><td>Highest interest rate</td></tr>
      <tr><th>Strength</th><td>Quick wins keep you going</td><td>Costs the least interest</td></tr>
      <tr><th>Your order</th><td>${names('snowball')}</td><td>${names('avalanche')}</td></tr>
      <tr><th>Your result</th><td class="num">${plan.list.length ? (plan.snowball.stuck ? 'Not paid off' : `${plan.snowball.months} months, ${fmt(Math.round(plan.snowball.interest))} interest`) : '—'}</td><td class="num">${plan.list.length ? (plan.avalanche.stuck ? 'Not paid off' : `${plan.avalanche.months} months, ${fmt(Math.round(plan.avalanche.interest))} interest`) : '—'}</td></tr>
    </tbody></table></div>
    <p>Avalanche is cheaper on paper. Snowball wins if clearing a small debt early is what keeps you paying. The plan you stick with beats the plan you abandon.</p>
    <div class="callout"><span class="e">💳</span><div class="b"><div><b>Keep cards under 30% of their limit.</b> The share of your limit in use is one of the larger inputs to a credit score. The Debt freedom page flags any card above the line.</div></div></div>
  </article>`;
}
